<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Ara DB 백과사전 &amp; 검색기 (아이템·영웅·용병·탈것·펫)</title>
  <meta name="description" content="디펜스 게임 Ara DB의 모든 아이템, 영웅(영덱), 지원용병, 탈것(57종), 펫(26종) 상세 정보와 수치 검색 기능">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
</head>

<body data-tab="items">
  <!-- Header (brand + global nav; nav turns into bottom tab bar on mobile) -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="Ara DB 홈">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0" />
            <path d="M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0" />
          </svg>
        </span>
        <span class="brand-name">Ara<b>DB</b></span>
      </a>

      <nav class="global-nav" id="globalNav" aria-label="카테고리">
        <button class="g-tab active" data-tab="items">
          <svg viewBox="0 0 24 24">
            <path d="M14.5 17.5 3 6V3h3l11.5 11.5" />
            <path d="m13 19 6-6" />
            <path d="m16 16 4 4" />
            <path d="m19 21 2-2" />
          </svg>
          <span>아이템</span>
        </button>
        <button class="g-tab" data-tab="heroes">
          <svg viewBox="0 0 24 24">
            <path d="m2 5 3 11h14l3-11-6 6-4-7-4 7-6-6z" />
            <path d="M5 20h14" />
          </svg>
          <span>영웅</span>
        </button>
        <button class="g-tab" data-tab="mercenaries">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>용병</span>
        </button>
        <button class="g-tab" data-tab="mounts">
          <svg viewBox="0 0 24 24">
            <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
            <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />
            <path d="M12.6 19.4A2 2 0 1 0 14 16H2" />
          </svg>
          <span>탈것</span>
        </button>
        <button class="g-tab" data-tab="pets">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="4" r="2" />
            <circle cx="18" cy="8" r="2" />
            <circle cx="20" cy="16" r="2" />
            <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.05Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
          </svg>
          <span>펫</span>
        </button>
        <button class="g-tab" data-tab="camp">
          <svg viewBox="0 0 24 24">
            <path d="m3 21 9-18 9 18H3z" />
            <path d="M9 21v-4a3 3 0 0 1 6 0v4" />
          </svg>
          <span>구조물/소품</span>
        </button>
        <button class="g-tab" data-tab="growth">
          <svg viewBox="0 0 24 24">
            <path d="M12 20V10M18 20V4M6 20v-4" />
            <path d="m3 9 9-7 9 7" />
          </svg>
          <span>성장</span>
        </button>
      </nav>

      <button id="adminBtn" type="button" class="btn-header admin-btn" title="관리자">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span class="hide-mobile">관리자</span>
      </button>
    </div>
  </header>

  <!-- Page Title -->
  <section class="hero-section">
    <h1 id="heroTitle" class="hero-title">아이템 도감 &amp; 능력치 검색</h1>
    <p id="heroSubtitle" class="hero-subtitle">이름, 초성, 능력 문장 뿐만 아니라 세부 수치 조건으로 자유롭게 검색하세요.</p>
  </section>

  <!-- Sticky Search Bar -->
  <div class="search-sticky">
    <div class="search-inner">
      <div class="search-row">
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7.5" />
            <path d="m20.5 20.5-4.2-4.2" />
          </svg>
          <input type="search" id="searchInput" class="main-search-input"
            placeholder="검색어 입력 (예: 빛단, ㅅㅁㅍㅍ, 처형, 치피>=100)" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button id="searchClear" class="search-clear-btn" title="검색어 지우기" aria-label="검색어 지우기">
            <svg viewBox="0 0 24 24">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
          <kbd class="search-kbd hide-mobile">/</kbd>
        </div>
        <button id="filterToggle" class="filter-toggle-btn" type="button" aria-expanded="false"
          aria-controls="filterPanel">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
          <span>필터</span>
          <span id="filterCount" class="filter-count" hidden>0</span>
        </button>
      </div>

      <!-- Search Hints (dynamic per tab) -->
      <div id="searchHints" class="search-hints"></div>
    </div>
  </div>

  <!-- ================= FILTER PANEL ================= -->
  <div id="filterPanel" class="filter-panel">

    <!-- ITEM CONTROLS -->
    <section id="itemControlSection" class="control-container">
      <div class="control-card">
        <div id="categoryTabs" class="category-tabs"></div>

        <div class="awakening-bar">
          <div class="awakening-label">각성 단계</div>
          <div id="awakeningSteps" class="awakening-steps">
            <button class="awakening-step-btn active" data-level="0">기본</button>
            <button class="awakening-step-btn" data-level="1">1각</button>
            <button class="awakening-step-btn" data-level="2">2각</button>
            <button class="awakening-step-btn" data-level="3">3각</button>
            <button class="awakening-step-btn" data-level="4">4각</button>
            <button class="awakening-step-btn" data-level="5">5각</button>
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-group">
            <select id="rangeFilter" class="filter-select" aria-label="공격 거리">
              <option value="all">공격 거리</option>
              <option value="근거리">근거리</option>
              <option value="원거리">원거리</option>
            </select>
            <select id="tierFilter" class="filter-select" aria-label="등급">
              <option value="all">등급</option>
              <option value="S">S 등급</option>
              <option value="A">A 등급</option>
              <option value="B">B 등급</option>
              <option value="C">C 등급</option>
              <option value="D">D 등급</option>
              <option value="E">E 등급</option>
              <option value="F">F 등급</option>
            </select>
            <select id="usageFilter" class="filter-select" aria-label="사용 추천">
              <option value="all">사용 추천</option>
              <option value="O">추천 (O)</option>
              <option value="△">상황별 (△)</option>
              <option value="X">비추천 (X)</option>
            </select>
            <select id="dropFilter" class="filter-select" aria-label="드랍처">
              <option value="all">드랍처</option>
            </select>
          </div>
          <div id="tagChips" class="tag-chips"></div>
        </div>
      </div>
    </section>

    <!-- HERO CONTROLS -->
    <section id="heroControlSection" class="control-container" style="display: none;">
      <div class="control-card">
        <div class="awakening-bar">
          <div class="awakening-label">레벨 능력</div>
          <div id="heroLevelSteps" class="awakening-steps">
            <button class="awakening-step-btn active" data-hlevel="base">기본</button>
            <button class="awakening-step-btn" data-hlevel="3">3Lv</button>
            <button class="awakening-step-btn" data-hlevel="6">6Lv</button>
            <button class="awakening-step-btn" data-hlevel="9">9Lv</button>
            <button class="awakening-step-btn" data-hlevel="12">12Lv</button>
            <button class="awakening-step-btn" data-hlevel="15">15Lv+</button>
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <select id="heroTierFilter" class="filter-select" aria-label="티어">
              <option value="all">티어</option>
              <option value="SSS">SSS 티어</option>
              <option value="SS">SS 티어</option>
              <option value="S">S 티어</option>
              <option value="A">A 티어</option>
              <option value="B">B 티어</option>
              <option value="C">C 티어</option>
              <option value="D">D 티어</option>
              <option value="E">E 티어</option>
              <option value="F">F 티어</option>
            </select>
            <select id="heroGradeFilter" class="filter-select" aria-label="등급">
              <option value="all">등급</option>
              <option value="전설">전설 영웅</option>
              <option value="희귀">희귀 영웅</option>
              <option value="일반">일반 영웅</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- MERCENARY CONTROLS -->
    <section id="mercControlSection" class="control-container" style="display: none;">
      <div class="control-card">
        <div class="awakening-bar">
          <div class="awakening-label">버프 등급</div>
          <div id="mercTierSteps" class="awakening-steps">
            <button class="awakening-step-btn" data-mtier="B">B<small>5렙</small></button>
            <button class="awakening-step-btn" data-mtier="A">A<small>9렙</small></button>
            <button class="awakening-step-btn" data-mtier="S">S<small>13렙</small></button>
            <button class="awakening-step-btn" data-mtier="SS">SS<small>17렙</small></button>
            <button class="awakening-step-btn active" data-mtier="SSS">SSS<small>20렙</small></button>
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <select id="mercGradeFilter" class="filter-select" aria-label="기본 등급">
              <option value="all">기본 등급</option>
              <option value="전설">전설</option>
              <option value="희귀">희귀</option>
              <option value="일반">일반</option>
            </select>
            <select id="mercRecFilter" class="filter-select" aria-label="추천도">
              <option value="all">추천도</option>
              <option value="SSS">SSS - 극추천</option>
              <option value="SS">SS - 필수급</option>
              <option value="S">S - 최고!</option>
              <option value="A">A - 자주 사용</option>
              <option value="B">B - 그럭저럭</option>
              <option value="J">J - 자동사냥용</option>
              <option value="C">C - 종종 사용</option>
              <option value="X">X - 사용안함</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- MOUNT CONTROLS -->
    <section id="mountControlSection" class="control-container" style="display: none;">
      <div class="control-card guide-bar">
        <div class="guide-text">
          <strong>탈것 뽑기 &amp; 부옵션</strong>
          <span>신급 펫 2마리로 탈것 뽑기 · 미스테리(20강)부터 부옵 활성화</span>
        </div>
        <button id="mountGuideBtn" class="btn-outline" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
          </svg>
          뽑기 · 부옵션 가이드
        </button>
      </div>
    </section>

    <!-- PET CONTROLS -->
    <section id="petControlSection" class="control-container" style="display: none;">
      <div class="control-card">
        <div class="guide-bar">
          <div class="guide-text">
            <strong>펫 등급 · 부옵 · 랜덤옵</strong>
            <span>타워/영덱 종결 추천 세팅과 옵션 풀을 확인하세요</span>
          </div>
          <button id="petGuideBtn" class="btn-outline" type="button">
            <svg viewBox="0 0 24 24">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
            </svg>
            추천 세팅 가이드
          </button>
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <select id="petTierFilter" class="filter-select" aria-label="티어">
              <option value="all">티어</option>
              <option value="S_group">S+ / S (종결)</option>
              <option value="A_group">A+ / A / A- (우수)</option>
              <option value="B_group">B+ / B (상황별)</option>
              <option value="C_group">C</option>
              <option value="D_group">D+ / D / D-</option>
              <option value="E_group">E / E-</option>
              <option value="F_group">F+ / F / F-</option>
            </select>
            <select id="petDropFilter" class="filter-select" aria-label="획득처">
              <option value="all">획득처</option>
              <option value="상점">상점 펫/오브젝트 뽑기</option>
              <option value="스테이지">스테이지</option>
              <option value="고블린">고블린 야영지</option>
              <option value="사원">불결한 사원</option>
              <option value="무덤">붉은 무덤</option>
              <option value="제단">이도교 제단</option>
              <option value="종말">전방위 / 종말 / 심연 등</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- CAMP CONTROLS (구조물 / 소품) -->
    <section id="campControlSection" class="control-container" style="display: none;">
      <div class="control-card">
        <div class="camp-controls-header">
          <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
            <div class="awakening-bar" style="margin-bottom: 0;">
              <div class="awakening-label">섹션 이동</div>
              <div id="campTypeFilter" class="awakening-steps">
                <button class="awakening-step-btn" type="button" data-scroll-to="structures">구조물 <span
                    class="badge-count">10</span></button>
                <button class="awakening-step-btn" type="button" data-scroll-to="props">소품 <span
                    class="badge-count">34</span></button>
              </div>
            </div>
            <div class="awakening-bar" style="margin-bottom: 0;">
              <div class="awakening-label">획득 레벨</div>
              <div id="campLevelSteps" class="awakening-steps">
                <button class="awakening-step-btn active" type="button" data-clevel="all">전체</button>
                <button class="awakening-step-btn" type="button" data-clevel="0">0렙</button>
                <button class="awakening-step-btn" type="button" data-clevel="20">20렙</button>
                <button class="awakening-step-btn" type="button" data-clevel="40">40렙</button>
                <button class="awakening-step-btn" type="button" data-clevel="60">60렙</button>
              </div>
            </div>
          </div>
          <button id="campCommonToggleBtn" class="btn-outline camp-common-toggle-btn" type="button"
            aria-expanded="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
            </svg>
            공통 옵션 정보 (등급·부옵·랜덤옵)
          </button>
        </div>
      </div>
    </section>

    <!-- GROWTH CONTROLS (성장) -->
    <section id="growthControlSection" class="control-container" style="display: none;">
      <div class="control-card guide-bar">
        <div class="guide-text">
          <strong>언더다크 성장 가이드 차트</strong>
          <span>성장에 필요한 재화, 스탯 증가치 및 레벨별 요구량 종합 안내도</span>
        </div>
        <div class="growth-toolbar-actions">
          <button id="growthZoomBtn" class="btn-outline" type="button">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3M11 8v6M8 11h6" />
            </svg>
            크게 보기
          </button>
          <a href="assets/growth/underdark_growth.png" download="언더다크_성장.png" class="btn-outline">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
            이미지 저장
          </a>
        </div>
      </div>
    </section>
  </div>

  <!-- Results Count & Sort & View Toggle -->
  <div class="results-meta">
    <div class="results-count">
      <span id="resultCount" class="count-highlight">0</span><span id="resultUnit">아이템</span>
    </div>
    <div class="results-actions">
      <div id="sortWrapper" class="sort-wrapper">
        <select id="sortSelect" class="filter-select filter-select-sm" aria-label="정렬">
          <option value="default">추천순</option>
          <option value="grade">등급순</option>
          <option value="name">이름순</option>
        </select>
      </div>
      <div id="viewModeToggle" class="view-mode-toggle" role="group" aria-label="보기 방식">
        <button type="button" class="view-btn" data-mode="table" title="표로 보기" aria-label="표로 보기">
          <svg viewBox="0 0 24 24">
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        </button>
        <button type="button" class="view-btn" data-mode="card" title="카드로 보기" aria-label="카드로 보기">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <main class="items-container">
    <div id="itemsGrid"></div>
  </main>

  <!-- Scroll To Top -->
  <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="맨 위로">
    <svg viewBox="0 0 24 24">
      <path d="m18 15-6-6-6 6" />
    </svg>
  </button>

  <!-- Detail Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modalContent" class="modal-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Data & Scripts -->
  <script src="data/items.js"></script>
  <script src="data/underdark_all.js"></script>
  <script src="js/search.js"></script>
  <script src="js/sheets_sync.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
